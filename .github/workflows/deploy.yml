name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean Cloudflare secrets (strip pasted spaces / line breaks)
        run: |
          ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          echo "Account ID length: ${#ID} (expected 32), hex only: $([[ $ID =~ ^[0-9a-f]+$ ]] && echo yes || echo no)"
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Tests
        run: npm test
      - name: KV namespace (create if missing)
        run: node scripts/ensure-kv.mjs
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Worker secrets (from GitHub secrets)
        env:
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          VIEW_KEY: ${{ secrets.VIEW_KEY }}
        run: node scripts/sync-secrets.mjs
      - name: Health check
        run: |
          sleep 8
          curl -sf https://home-office.bassim-raji.workers.dev/health
