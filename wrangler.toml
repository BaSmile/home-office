name = "home-office"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "KV"
# Filled in by scripts/ensure-kv.mjs during deploy (creates the namespace the first time).
id = "__KV_ID__"

[vars]
OWNER_NAME = "Bassim"
RADIUS_KM = "15"   # distance from Kenitra centre counted as "home"

# Optional secrets (synced from GitHub secrets by the deploy workflow). Not set = no key needed.
#   OWNER_KEY  locks /me and location updates
#   VIEW_KEY   locks the status page (open once with ?k=..., remembered by cookie)
